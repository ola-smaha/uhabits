name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :uhabits-core:jvmTest 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: Build release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export LOOP_KEY_STORE="$RUNNER_TEMP/release.jks"
            export LOOP_KEY_ALIAS="$SIGNING_KEY_ALIAS"
            export LOOP_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
            export LOOP_STORE_PASSWORD="$SIGNING_STORE_PASSWORD"
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set, so the APK is unsigned and must be signed before installing."
          fi
          ./gradlew --no-daemon --stacktrace :uhabits-android:assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/release.jks"
          exit $status

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            grep -E '^e: |^> |FAILED|What went wrong|Exception|error:|Caused by' "$f" | head -60 > errors.txt || true
            [ -s errors.txt ] || tail -40 "$f" > errors.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          VERSION=$(grep versionName uhabits-android/build.gradle.kts | sed -e 's/.*"\([^"]*\)".*/\1/')
          SUFFIX=""
          [ "$HAS_SIGNING_KEY" = "true" ] || SUFFIX="-unsigned"
          NAME="LoopSync-${VERSION}.${{ github.run_number }}${SUFFIX}.apk"
          mkdir -p dist
          cp uhabits-android/build/outputs/apk/release/*.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loop-sync-apk
          path: dist/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/google-drive-sync'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Loop Sync ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.HAS_SIGNING_KEY != 'true' }}
          make_latest: ${{ env.HAS_SIGNING_KEY == 'true' && github.ref == 'refs/heads/dev' }}
          files: dist/${{ steps.apk.outputs.name }}
          body: |
            Install this APK on each device (the same file works on phones and tablets).
            Built from ${{ github.sha }}.
